<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Crowd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f6ebe6; --ink: #2b2430; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
    font: 11px/1.45 'IBM Plex Mono', ui-monospace, monospace; }
  #plate, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { pointer-events: none; }
  #banner { position: fixed; left: 14px; top: 12px; padding: 5px 8px; border-radius: 3px; pointer-events: none;
    transition: background 1.2s, color 1.2s; }
  #banner b { font-weight: 500; letter-spacing: 0.08em; margin-right: 8px; }
  #banner span { opacity: 0.65; }
  #banner.flash { background: var(--ink); color: var(--paper); transition: none; }
  #legend { position: fixed; left: 14px; bottom: 12px; opacity: 0.5; pointer-events: none; font-size: 10px; }
  #stats { position: fixed; left: 14px; bottom: 34px; opacity: 0.7; white-space: pre; display: none;
    pointer-events: none; }
  #chat { position: fixed; right: 0; top: 0; bottom: 0; width: 280px; box-sizing: border-box; padding: 12px 12px 14px;
    background: #f6ebe6b8; border-left: 1px solid #2b243022; display: flex; flex-direction: column;
    justify-content: flex-end; overflow: hidden; backdrop-filter: blur(3px); }
  #chat[hidden] { display: none; }
  #chat div { padding: 1.5px 4px; border-radius: 2px; overflow-wrap: anywhere; }
  #chat div:hover { background: #2b243014; }
  #chat .who { font-weight: 500; }
  #chat .quiet { opacity: 0.5; }
  #picker { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #f6ebe6f2;
    border: 1px solid #2b243033; padding: 14px 18px; min-width: 300px; max-height: 70vh; overflow: auto; }
  #picker h1 { font-size: 11px; font-weight: 500; opacity: 0.6; margin: 10px 0 6px; text-transform: uppercase; }
  #picker h1:first-child { margin-top: 0; }
  #picker button { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit;
    font: inherit; padding: 4px 6px; cursor: pointer; }
  #picker button:hover { background: #2b24301a; }
  #picker[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="plate"></canvas>
<canvas id="overlay"></canvas>
<div id="banner"></div>
<div id="stats"></div>
<div id="legend"></div>
<div id="chat"></div>
<div id="picker" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
