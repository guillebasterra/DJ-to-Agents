<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Crowd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1214; color: #d8d4d6;
    font: 11px 'IBM Plex Mono', ui-monospace, monospace; }
  #grain, #plate, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #grain { image-rendering: pixelated; opacity: 0.5; }
  #overlay { pointer-events: none; }
  #stats { position: fixed; right: 12px; bottom: 12px; opacity: 0.7; white-space: pre; text-align: right;
    display: none; pointer-events: none; }
  #hint { position: fixed; left: 12px; bottom: 12px; opacity: 0.35; pointer-events: none; }
  #picker { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #1a1214ee;
    border: 1px solid #d8d4d633; padding: 14px 18px; min-width: 300px; max-height: 70vh; overflow: auto; }
  #picker h1 { font-size: 11px; font-weight: 500; opacity: 0.6; margin: 10px 0 6px; text-transform: uppercase; }
  #picker h1:first-child { margin-top: 0; }
  #picker button { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit;
    font: inherit; padding: 4px 6px; cursor: pointer; }
  #picker button:hover { background: #d8d4d61a; }
  #picker[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="grain"></canvas>
<canvas id="plate"></canvas>
<canvas id="overlay"></canvas>
<div id="stats"></div>
<div id="hint"></div>
<div id="picker" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
